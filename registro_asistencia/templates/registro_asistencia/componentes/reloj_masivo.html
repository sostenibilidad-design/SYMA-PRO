<div class="rp-reloj-display">
    <!-- Horas -->
    <div class="rp-reloj-bloque">
        <div class="rp-digito-box"><span id="hora-decena">0</span></div>
        <div class="rp-digito-box"><span id="hora-unidad">0</span></div>
    </div>
    
    <!-- Separador -->
    <div class="rp-reloj-separador">:</div>
    
    <!-- Minutos -->
    <div class="rp-reloj-bloque">
        <div class="rp-digito-box"><span id="min-decena">0</span></div>
        <div class="rp-digito-box"><span id="min-unidad">0</span></div>
    </div>
    
    <!-- Selector AM / PM -->
    <div class="rp-reloj-ampm">
        <button type="button" class="rp-ampm-btn active" data-value="AM">A.M</button>
        <button type="button" class="rp-ampm-btn" data-value="PM">P.M</button>
    </div>
</div>
