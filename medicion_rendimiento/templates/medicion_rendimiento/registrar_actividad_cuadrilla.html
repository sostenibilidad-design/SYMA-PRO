{% load static %}

<!-- === MODAL REGISTRAR INICIO DE ACTIVIDAD === -->
<div id="modal-actividad" class="modal-overlay">
    <div class="modal">
        <h2 class="titulo">Registrar inicio de actividad</h2>

        <form class="formulario" method="POST" enctype="multipart/form-data" action="{% url 'registrar_inicio_medicion' proyecto_actual.id_proyectos %}">
            {% csrf_token %}

            <div class="funcionalidades-box">  
                <div class="titulo-funcionalidades" id="header-actividad"> 
                    <strong id="texto-actividad-seleccionada">Seleccione una actividad</strong>
                </div>

                <div class="contenido-funcionalidades dropdown" id="dropdown-actividad" style="display: none;">
                    <input type="text" id="busqueda-actividad" class="input-busqueda-empleado" placeholder="Buscar actividad...">

                    <div class="lista-actividades" style="max-height: 200px; overflow-y: auto;"> 
                        {% for c in Cumplimientos %}
                        <div class="area-item actividad-item">
                            <label class="area-label">
                                <input type="radio" name="actividad" class="area-checkbox radio-actividad" value="{{ c.actividad }}" required>
                                <strong>{{ c.actividad }}</strong>
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <input type="text" name="hora_inicio" id="input-hora-inicio" placeholder="Hora de inicio"
                    onfocus="(this.type='time')" onblur="if(!this.value) this.type='text'" required>
            </div>

            <div class="file-wrapper" onclick="abrirOpcionesFoto('id_foto_inicio')">
                <span class="fileText" id="fileText_inicio">Insertar imagen</span>
                <input type="file" name="foto_inicio" id="id_foto_inicio" accept="image/*" style="display: none;">
            </div>

            <!-- BLOQUE DE SELECCIÓN DE EMPLEADOS (adaptado) -->
            <div class="funcionalidades-box">  
                <div class="titulo-funcionalidades"> 
                    <strong>Seleccionar empleados</strong>
                </div>

                <div class="contenido-funcionalidades dropdown" style="display: none;">  <!-- QUITADO id="area-dropdown" -->
                    <input type="text" class="input-busqueda-empleado" placeholder="Buscar usuario...">  <!-- QUITADO id="busqueda-empleado" -->

                    <div class="lista-empleados">  <!-- CAMBIADO id → class -->
                        {% for emp in empleados %}
                            {% if  "oficial" in emp.cargo|lower or "ayudante" in emp.cargo|lower %}
                            <div class="area-item">
                                <label class="area-label">
                                    <input type="checkbox" name="empleados" class="area-checkbox" value="{{ emp.cedula }}">
                                    <strong>{{ emp.nombre_completo|capfirst }}</strong>
                                </label>
                            </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="botones">
                <button type="submit" class="btn-guardar">Guardar</button>
                <button type="button" id="btnCerrar" data-modal="modal-actividad" class="btn-cancelar">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'js/comprimir_imagen.js' %}?v=2"></script>
